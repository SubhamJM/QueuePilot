# QueuePilot coordinator configuration.
# Default profile: embedded H2 database stored in ./data (PostgreSQL compatibility mode) so the
# project runs with nothing installed. Use the "postgres" profile for PostgreSQL (see docs/guides).
server:
  port: 8080
  address: 127.0.0.1
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: queuepilot-coordinator
  datasource:
    url: jdbc:h2:file:${queuepilot.data-dir}/db/queuepilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  jackson:
    default-property-inclusion: always
  web:
    resources:
      cache:
        cachecontrol:
          # The dashboard is small; always revalidate so a rebuilt coordinator never serves stale JS.
          no-cache: true

queuepilot:
  data-dir: ./data
  heartbeat-interval-ms: 1000
  lease-duration-ms: 10000
  worker-timeout-ms: 10000
  recovery-interval-ms: 1000
  recovery-enabled: true
  # "Add worker" in the dashboard starts this jar; launched workers use demo pacing so jobs are watchable.
  worker-jar: queuepilot-worker/target/queuepilot-worker-1.0.0-exec.jar
  launched-worker-pace-ms: 150

logging:
  level:
    root: INFO
    org.hibernate.orm.deprecation: WARN
